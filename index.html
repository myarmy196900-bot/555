<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>3D Racing</title>
<style>
body {
    margin: 0;
    overflow: hidden;
    background: #111;
    font-family: Arial;
}
canvas {
    display: block;
}
#info {
    position: absolute;
    top: 15px;
    left: 15px;
    color: white;
    font-size: 25px;
}
#help {
    position: absolute;
    bottom: 20px;
    width: 100%;
    text-align: center;
    color: white;
    font-size: 18px;
}
</style>
</head>
<body>
<div id="info">SCORE: <span id="score">0</span></div>
<div id="help">Управление: ← → или A D | Перезапуск: R</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x87ceeb);
scene.fog = new THREE.Fog(0x87ceeb, 30, 100);
const camera = new THREE.PerspectiveCamera(70, window.innerWidth/window.innerHeight, 0.1, 1000);
camera.position.set(0, 7, 11);
camera.lookAt(0, 0, -5);
const renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setSize(window.innerWidth, window.innerHeight);
document.body.appendChild(renderer.domElement);
scene.add(new THREE.HemisphereLight(0xffffff, 0x444444, 2));
const light = new THREE.DirectionalLight(0xffffff, 2);
light.position.set(5,10,5);
scene.add(light);
// Дорога
const road = new THREE.Mesh(
    new THREE.BoxGeometry(12,0.2,200),
    new THREE.MeshStandardMaterial({color:0x333333})
);
road.position.z = -80;
scene.add(road);
// Земля
const ground = new THREE.Mesh(
    new THREE.BoxGeometry(200,0.2,200),
    new THREE.MeshStandardMaterial({color:0x228822})
);
ground.position.set(0,-0.2,-80);
scene.add(ground);
// Разметка
let lines = [];
for(let i=0;i<20;i++){
    let line = new THREE.Mesh(
        new THREE.BoxGeometry(0.15,0.04,3),
        new THREE.MeshBasicMaterial({color:0xffffff})
    );
    line.position.set(0,0.12,-i*10);
    scene.add(line);
    lines.push(line);
}
// Создание машины
function createCar(color){
    const car = new THREE.Group();
    const body = new THREE.Mesh(
        new THREE.BoxGeometry(1.5,0.6,2.8),
        new THREE.MeshStandardMaterial({color:color})
    );
    body.position.y=0.55;
    car.add(body);
    const top = new THREE.Mesh(
        new THREE.BoxGeometry(1.1,0.6,1.3),
        new THREE.MeshStandardMaterial({color:0x111111})
    );
    top.position.set(0,1.1,-0.1);
    car.add(top);
    for(let x of [-0.8,0.8]){
        for(let z of [-0.9,0.9]){
            let wheel = new THREE.Mesh(
                new THREE.CylinderGeometry(0.35,0.35,0.25,16),
                new THREE.MeshStandardMaterial({color:0x111111})
            );
            wheel.rotation.z=Math.PI/2;
            wheel.position.set(x,0.35,z);
            car.add(wheel);
        }
    }
    return car;
}
const player = createCar(0xff2222);
player.position.set(0,0,4);
scene.add(player);
let enemies=[];
let score=0;
let speed=0.5;
let gameOver=false;
function spawnEnemy(){
    if(gameOver)return;
    const enemy=createCar(0x2222ff);
    enemy.position.set([-4,0,4][Math.floor(Math.random()*3)],0,-80);
    scene.add(enemy);
    enemies.push(enemy);
}
setInterval(spawnEnemy,1300);
let keys={};
document.addEventListener("keydown",e=>{
    keys[e.key.toLowerCase()]=true;
    if(e.key.toLowerCase()==="r") location.reload();
});
document.addEventListener("keyup",e=>{
    keys[e.key.toLowerCase()]=false;
});
function animate(){
    requestAnimationFrame(animate);
    if(!gameOver){
        if(keys["arrowleft"]||keys["a"]) player.position.x-=0.12;
        if(keys["arrowright"]||keys["d"]) player.position.x+=0.12;
        player.position.x=Math.max(-4,Math.min(4,player.position.x));
        lines.forEach(line=>{
            line.position.z+=speed*2;
            if(line.position.z>10)line.position.z-=200;
        });
        enemies.forEach((enemy,index)=>{
            enemy.position.z+=speed;
            if(Math.abs(enemy.position.x-player.position.x)<1.3 &&
               Math.abs(enemy.position.z-player.position.z)<2){
                gameOver=true;
                document.getElementById("help").innerHTML=
                "ИГРА ОКОНЧЕНА! Нажми R для рестарта";
            }
            if(enemy.position.z>15){
                scene.remove(enemy);
                enemies.splice(index,1);
                score++;
                document.getElementById("score").textContent=score;
                speed+=0.005;
            }
        });
    }
    renderer.render(scene,camera);
}
animate();
window.addEventListener("resize",()=>{
    camera.aspect=window.innerWidth/window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth,window.innerHeight);
});
</script>
</body>
</html>
